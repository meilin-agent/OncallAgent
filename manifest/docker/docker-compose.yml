services:
  # 这个 etcd 服务是 Milvus 的分布式协调服务，负责管理 Milvus 集群中的节点信息和状态。它提供了一个分布式键值存储，Milvus 可以通过它来实现分布式锁、服务发现等功能。
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
  # 这个 minio 服务是 Milvus 的对象存储服务，负责存储 Milvus 中的向量数据和相关文件。它提供了一个 S3 兼容的接口，Milvus 可以通过这个接口来读写数据。
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  # 这个 standalone 服务是 Milvus 向量数据库服务，负责存储和管理向量数据。它依赖于 etcd 和 minio 来提供分布式协调和对象存储功能。
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
  # 这是 Attu 服务哦，它会连接到 Milvus standalone 服务，提供一个可视化界面来管理和查询 Milvus 中的向量数据。
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.6
    ports:
      - "8000:3000" # 把本地的 8000 端口映射到容器的 3000 端口 (Attu 默认端口)
    environment:
      # MILVUS_URL 指向 Docker 网络里的 Milvus standalone 服务
      MILVUS_URL: standalone:19530
    depends_on:
      - standalone # 确保 Milvus 启动后再启动 Attu

  # 这个 prometheus 服务
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    # 让容器内的 host.docker.internal 指向宿主机（抓取宿主机上原生运行的 test-server）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus_config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_config/alert.rules:/etc/prometheus/alert.rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped

  # 这个 test-server 服务是一个简单的 HTTP 服务器，用于模拟一些测试数据的生成和暴露，供 Prometheus 来抓取和监控。
  test-server:
    build:
      context: .
      dockerfile: ./prometheusTestServer/Dockerfile
    container_name: test-server
    ports:
      - "2112:2112"
    restart: unless-stopped

networks:
  default:
    name: milvus