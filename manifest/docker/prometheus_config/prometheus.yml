global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert.rules"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 抓取宿主机上原生运行的测试服务器（host.docker.internal 指向宿主机）
  # 说明：test-server 以原生进程方式运行（见 start-oncall.bat），
  # 不要使用 docker 容器方式（其构建上下文缺少根目录 go.mod，无法构建）
  - job_name: "oncall-test"
    static_configs:
      - targets: ["host.docker.internal:2112"]
